{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Toys Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            Toys Store
        </a>

        <div>

            <a class="btn btn-outline-light me-2" href="/">
                Главная
            </a>

            <a class="btn btn-outline-light me-2" href="/catalog/">
                Каталог
            </a>

            {% if user.is_authenticated %}
                <a class="btn btn-outline-light me-2" href="/cart/">
                    Корзина
                </a>
                <form method="post" action="/accounts/logout/" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-secondary">Выйти ({{ user.username }})</button>
                </form>
            {% else %}
                <a class="btn btn-outline-light" href="/accounts/login/">
                    Войти
                </a>
            {% endif %}

        </div>

    </div>

</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

<footer class="bg-dark text-white text-center p-3 mt-5">

    Магазин игрушек и коллекционной атрибутики

</footer>

{% block scripts %}
{% endblock %}

</body>
</html>
