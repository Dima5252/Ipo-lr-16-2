{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Каталог товаров</h2>

<form method="get" class="row g-2 mb-4">

    <div class="col-md-4">
        <input type="text" name="search" placeholder="Поиск" value="{{ request.GET.search }}" class="form-control">
    </div>

    <div class="col-md-3">
        <select name="category" class="form-select">
            <option value="">Все категории</option>
            {% for category in categories %}
                <option value="{{ category.id }}" {% if request.GET.category == category.id|stringformat:"s" %}selected{% endif %}>
                    {{ category.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-3">
        <select name="manufacturer" class="form-select">
            <option value="">Все производители</option>
            {% for manufacturer in manufacturers %}
                <option value="{{ manufacturer.id }}" {% if request.GET.manufacturer == manufacturer.id|stringformat:"s" %}selected{% endif %}>
                    {{ manufacturer.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">Поиск</button>
    </div>

</form>

<div class="row">

    {% for product in products %}

    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">

            {% if product.image %}
                <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
            {% endif %}

            <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text text-muted">{{ product.price }} BYN</p>
                <div class="mt-auto d-flex gap-2">
                    <a href="/product/{{ product.id }}/" class="btn btn-primary btn-sm">Подробнее</a>
                    <a href="/cart/add/{{ product.id }}/" class="btn btn-success btn-sm">В корзину</a>
                </div>
            </div>

        </div>
    </div>

    {% empty %}
        <p class="text-muted">Товары не найдены.</p>
    {% endfor %}

</div>

{% endblock %}
