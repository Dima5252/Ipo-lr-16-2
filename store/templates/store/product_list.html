<!DOCTYPE html>
<html>
<head>
    <title>Каталог</title>
</head>
<body>

<h1>Каталог товаров</h1>

<form method="get">

<input
type="text"
name="search"
placeholder="Поиск">

<select name="category">

<option value="">
Все категории
</option>

{% for category in categories %}

<option value="{{ category.id }}">
{{ category.name }}
</option>

{% endfor %}

</select>

<select name="manufacturer">

<option value="">
Все производители
</option>

{% for manufacturer in manufacturers %}

<option value="{{ manufacturer.id }}">
{{ manufacturer.name }}
</option>

{% endfor %}

</select>

<button type="submit">
Поиск
</button>

</form>

<hr>

{% for product in products %}

<h3>{{ product.name }}</h3>

<p>
{{ product.price }} BYN
</p>

<a href="/catalog/{{ product.id }}/">
Подробнее
</a>

<br><br>

<a href="/cart/add/{{ product.id }}/">
Добавить в корзину
</a>

<hr>

{% endfor %}

</body>
</html>
