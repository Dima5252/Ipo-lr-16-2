<!DOCTYPE html>
<html>
<head>
<title>Корзина</title>
</head>
<body>

<h1>
Корзина
</h1>

<table border="1">

<tr>
<th>Товар</th>
<th>Количество</th>
<th>Стоимость</th>
<th>Действие</th>
</tr>

{% for item in items %}

<tr>

<td>
{{ item.product.name }}
</td>

<td>

<form
action="/cart/update/{{ item.id }}/"
method="post">

{% csrf_token %}

<input
type="number"
name="quantity"
value="{{ item.quantity }}">

<button type="submit">
Обновить
</button>

</form>

</td>

<td>
{{ item.item_cost }}
</td>

<td>

<a href="/cart/remove/{{ item.id }}/">
Удалить
</a>

</td>

</tr>

{% endfor %}

</table>

<h2>

Общая стоимость:

{{ cart.total_cost }}

</h2>

<a href="/catalog/">

Вернуться в каталог

</a>

</body>
</html>
