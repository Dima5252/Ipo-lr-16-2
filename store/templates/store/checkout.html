{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <h2 class="mb-4">Оформление заказа</h2>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-bold">Адрес доставки</label>
                <textarea name="address" required class="form-control" rows="3" placeholder="Введите адрес доставки"></textarea>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/cart/" class="btn btn-outline-secondary">Назад в корзину</a>
                <button type="submit" class="btn btn-success">Подтвердить заказ</button>
            </div>

        </form>

    </div>
</div>

{% endblock %}
