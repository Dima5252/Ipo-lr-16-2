{% extends 'base.html' %}

{% block content %}

<h1>{{ product.name }}</h1>

<p>{{ product.description }}</p>

<p>
    Цена:
    {{ product.price }} BYN
</p>

<p>
    Остаток:
    {{ product.stock_quantity }}
</p>

{% if product.stock_quantity > 0 %}

<button class="btn btn-success">
    В корзину
</button>

{% else %}

<button class="btn btn-secondary" disabled>
    Нет в наличии
</button>

{% endif %}

{% endblock %}
